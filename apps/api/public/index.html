<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Loreforge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --void: #12081F;
      --nebula: #2A1548;
      --arcane: #7C3AED;
      --spirit: #67E8F9;
      --ember: #F97316;
      --parchment: #F3EDE4;
      --parchment-dim: #B8AECB;
    }
    * { margin: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: var(--void);
      color: var(--parchment);
      font-family: Inter, system-ui, sans-serif;
      line-height: 1.6;
    }
    main { max-width: 880px; margin: 0 auto; padding: 2rem 1rem 4rem; }
    h1 {
      font-family: Cinzel, serif;
      font-size: clamp(2rem, 6vw, 3.2rem);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-align: center;
      background: linear-gradient(90deg, var(--arcane), var(--spirit));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 0.25rem;
    }
    .tagline { text-align: center; color: var(--parchment-dim); margin-bottom: 2.5rem; }
    h2 {
      font-family: Cinzel, serif;
      font-size: 1.15rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--spirit);
      margin: 2rem 0 1rem;
    }
    .panel {
      background: var(--nebula);
      border-radius: 12px;
      padding: 1.25rem;
      margin-bottom: 1rem;
    }
    input[type=email], input[type=text], textarea {
      width: 100%;
      background: var(--void);
      color: var(--parchment);
      border: 1px solid #4b2f7a;
      border-radius: 8px;
      padding: 0.6rem 0.8rem;
      font: inherit;
      margin-bottom: 0.75rem;
    }
    textarea { min-height: 180px; font-family: "JetBrains Mono", monospace; font-size: 0.85rem; }
    input:focus-visible, textarea:focus-visible, button:focus-visible {
      outline: 2px solid var(--spirit);
      outline-offset: 2px;
    }
    button {
      background: var(--arcane);
      color: var(--parchment);
      border: 0;
      border-radius: 8px;
      padding: 0.6rem 1.4rem;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { filter: brightness(1.15); }
    button.ghost { background: transparent; border: 1px solid #4b2f7a; color: var(--parchment-dim); }
    button:disabled { opacity: 0.5; cursor: wait; }
    .msg { color: var(--parchment-dim); font-size: 0.9rem; margin-top: 0.5rem; overflow-wrap: anywhere; }
    .msg a { color: var(--spirit); }
    .error { color: var(--ember); }
    .row { display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
    .spread { justify-content: space-between; }

    .bible-card {
      display: flex; justify-content: space-between; align-items: center;
      gap: 1rem; cursor: pointer; transition: transform 0.15s ease;
    }
    .bible-card:hover { transform: translateX(4px); }
    .bible-card .title { font-family: Cinzel, serif; font-size: 1.05rem; letter-spacing: 0.05em; }
    .status {
      font-family: "JetBrains Mono", monospace; font-size: 0.72rem;
      padding: 0.15rem 0.6rem; border-radius: 99px; border: 1px solid var(--parchment-dim);
      color: var(--parchment-dim); text-transform: uppercase; letter-spacing: 0.08em;
    }
    .status.analyzed { border-color: var(--spirit); color: var(--spirit); }
    .status.analyzing { border-color: var(--ember); color: var(--ember); }

    .radar-wrap { display: flex; gap: 2rem; flex-wrap: wrap; align-items: center; justify-content: center; }
    .global-score {
      font-family: "JetBrains Mono", monospace; font-size: 3rem; color: var(--spirit);
      text-align: center;
    }
    .global-score small { display: block; font-size: 0.8rem; color: var(--parchment-dim); font-family: Inter, sans-serif; }
    .gap-item {
      border-left: 3px solid var(--arcane);
      padding: 0.4rem 0.8rem; margin-bottom: 0.5rem;
      background: rgba(124, 58, 237, 0.08); border-radius: 0 8px 8px 0;
    }
    .gap-item .axis {
      font-family: "JetBrains Mono", monospace; font-size: 0.72rem;
      color: var(--spirit); text-transform: uppercase; letter-spacing: 0.08em;
    }
    .hidden { display: none !important; }
    svg text { fill: var(--parchment-dim); font-family: Inter, sans-serif; font-size: 11px; }
    svg .score-label { fill: var(--spirit); font-family: "JetBrains Mono", monospace; font-size: 12px; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
<main>
  <h1>Loreforge</h1>
  <p class="tagline">Vivez votre univers.</p>

  <!-- Connexion -->
  <section id="auth-section" class="panel hidden">
    <h2>Entrer dans la forge</h2>
    <form id="login-form">
      <input type="email" id="login-email" placeholder="votre@email.com" required autocomplete="email" />
      <button type="submit">Recevoir le lien magique</button>
    </form>
    <p id="login-msg" class="msg"></p>
  </section>

  <!-- Bibliothèque -->
  <section id="library-section" class="hidden">
    <div class="row spread">
      <h2>Bibliothèque</h2>
      <button class="ghost" id="logout-btn">Se déconnecter</button>
    </div>
    <div id="bible-list"></div>
    <div class="panel">
      <h2 style="margin-top:0">Importer une bible</h2>
      <input type="text" id="import-title" placeholder="Titre (optionnel, sinon déduit du Markdown)" />
      <textarea id="import-md" placeholder="# Mon Univers&#10;&#10;Collez ici le Markdown de votre bible…"></textarea>
      <div class="row">
        <button id="import-btn">Importer</button>
        <label class="msg">ou fichier .md : <input type="file" id="import-file" accept=".md,.markdown,.txt" /></label>
      </div>
      <p id="import-msg" class="msg"></p>
    </div>
  </section>

  <!-- Détail bible -->
  <section id="detail-section" class="hidden">
    <div class="row spread">
      <h2 id="detail-title"></h2>
      <button class="ghost" id="back-btn">← Bibliothèque</button>
    </div>

    <div class="panel">
      <div class="row spread">
        <span id="detail-status" class="status"></span>
        <button id="analyze-btn">Analyser la richesse</button>
      </div>
      <p id="analyze-msg" class="msg"></p>
      <div id="richness-block" class="hidden">
        <div class="radar-wrap">
          <svg id="radar" width="340" height="320" viewBox="0 0 340 320" role="img" aria-label="Radar de richesse à 5 axes">
            <defs>
              <linearGradient id="radar-grad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#7C3AED" />
                <stop offset="100%" stop-color="#67E8F9" />
              </linearGradient>
            </defs>
            <g id="radar-grid"></g>
            <g id="radar-value"></g>
            <g id="radar-labels"></g>
          </svg>
          <div class="global-score"><span id="global-score"></span><small>indice global /10</small></div>
        </div>
        <h2>Zones floues</h2>
        <div id="gaps-list"></div>
      </div>
    </div>

    <div class="panel">
      <h2 style="margin-top:0">Canon</h2>
      <textarea id="canon-editor"></textarea>
      <div class="row">
        <button id="save-canon-btn">Enregistrer</button>
        <span id="save-msg" class="msg"></span>
      </div>
    </div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const api = (path, opts = {}) => fetch("/api" + path, opts);
const json = (body) => ({
  method: "POST",
  headers: { "content-type": "application/json" },
  body: JSON.stringify(body),
});

const AXIS_LABELS = {
  cosmology: "Cosmologie",
  characters: "Personnages",
  plots: "Trames",
  tone: "Ton",
  geography: "Géographie",
};
const AXES = Object.keys(AXIS_LABELS);

let currentBible = null;
let pollTimer = null;

// ---------- Navigation ----------
function show(section) {
  for (const id of ["auth-section", "library-section", "detail-section"]) {
    $(id).classList.toggle("hidden", id !== section);
  }
}

async function boot() {
  const me = await api("/auth/me");
  if (me.ok) {
    show("library-section");
    loadLibrary();
  } else {
    show("auth-section");
  }
}

// ---------- Auth ----------
$("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const res = await api("/auth/magic-link", json({ email: $("login-email").value }));
  const body = await res.json();
  if (!res.ok) {
    $("login-msg").textContent = "Email invalide.";
    $("login-msg").className = "msg error";
    return;
  }
  $("login-msg").className = "msg";
  if (body.dev_link) {
    $("login-msg").innerHTML =
      'Mode dev — <a href="' + body.dev_link + '">cliquez ici pour vous connecter</a>.';
  } else {
    $("login-msg").textContent = "Lien magique envoyé (valable 15 minutes).";
  }
});

$("logout-btn").addEventListener("click", async () => {
  await api("/auth/logout", { method: "POST" });
  show("auth-section");
});

// ---------- Bibliothèque ----------
async function loadLibrary() {
  const res = await api("/bibles");
  if (!res.ok) return;
  const { bibles } = await res.json();
  const list = $("bible-list");
  list.innerHTML = "";
  if (bibles.length === 0) {
    list.innerHTML = '<p class="msg">Aucune bible pour l’instant — importez la première ci-dessous.</p>';
    return;
  }
  for (const b of bibles) {
    const card = document.createElement("div");
    card.className = "panel bible-card";
    card.innerHTML =
      '<span class="title"></span><span class="status ' + b.status + '">' + b.status + "</span>";
    card.querySelector(".title").textContent = b.title;
    card.addEventListener("click", () => openBible(b.id));
    list.appendChild(card);
  }
}

async function importBible(markdown, title) {
  $("import-btn").disabled = true;
  const res = await api("/bibles", json({ markdown, title: title || undefined }));
  $("import-btn").disabled = false;
  const body = await res.json();
  if (!res.ok) {
    $("import-msg").textContent = "Import refusé : " + (body.error || res.status);
    $("import-msg").className = "msg error";
    return;
  }
  $("import-msg").textContent = "";
  $("import-md").value = "";
  $("import-title").value = "";
  openBible(body.id);
}

$("import-btn").addEventListener("click", () => {
  const md = $("import-md").value;
  if (md.trim() === "") {
    $("import-msg").textContent = "Collez du Markdown d’abord.";
    $("import-msg").className = "msg error";
    return;
  }
  importBible(md, $("import-title").value.trim());
});

$("import-file").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const text = await file.text();
  importBible(text, $("import-title").value.trim() || file.name.replace(/\.(md|markdown|txt)$/i, ""));
  e.target.value = "";
});

// ---------- Détail ----------
async function openBible(id) {
  clearInterval(pollTimer);
  const res = await api("/bibles/" + id);
  if (!res.ok) return;
  currentBible = await res.json();
  $("detail-title").textContent = currentBible.title;
  $("canon-editor").value = currentBible.canon_md || "";
  $("analyze-msg").textContent = "";
  $("save-msg").textContent = "";
  renderStatus(currentBible.status);
  show("detail-section");
  refreshRichness();
}

function renderStatus(status) {
  const el = $("detail-status");
  el.textContent = status;
  el.className = "status " + status;
  $("analyze-btn").disabled = status === "analyzing";
}

$("back-btn").addEventListener("click", () => {
  clearInterval(pollTimer);
  show("library-section");
  loadLibrary();
});

$("save-canon-btn").addEventListener("click", async () => {
  const res = await api("/bibles/" + currentBible.id, {
    method: "PATCH",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ canon_md: $("canon-editor").value }),
  });
  $("save-msg").textContent = res.ok ? "Canon enregistré." : "Échec de l’enregistrement.";
  $("save-msg").className = res.ok ? "msg" : "msg error";
});

// ---------- Richesse ----------
$("analyze-btn").addEventListener("click", async () => {
  const res = await api("/bibles/" + currentBible.id + "/analyze", { method: "POST" });
  const body = await res.json();
  if (!res.ok) {
    $("analyze-msg").textContent =
      body.error === "analyzer_not_configured"
        ? "L’analyseur n’est pas configuré côté serveur (clé Anthropic manquante)."
        : "Analyse impossible : " + (body.error || res.status);
    $("analyze-msg").className = "msg error";
    return;
  }
  $("analyze-msg").textContent = "Analyse en cours — l’esprit examine votre monde…";
  $("analyze-msg").className = "msg";
  renderStatus("analyzing");
  startPolling();
});

function startPolling() {
  clearInterval(pollTimer);
  pollTimer = setInterval(refreshRichness, 2500);
}

async function refreshRichness() {
  const res = await api("/bibles/" + currentBible.id + "/richness");
  if (!res.ok) return;
  const body = await res.json();
  if (body.status === "analyzing") {
    renderStatus("analyzing");
    if (!pollTimer) startPolling();
    return;
  }
  clearInterval(pollTimer);
  pollTimer = null;
  if (body.status === "analyzed") {
    renderStatus("analyzed");
    $("analyze-msg").textContent = "";
    $("richness-block").classList.remove("hidden");
    renderRadar(body.scores);
    $("global-score").textContent = body.global;
    renderGaps(body.gaps);
  } else {
    // 'none' : soit jamais analysé, soit l'analyse vient d'échouer.
    if ($("detail-status").textContent === "analyzing") {
      $("analyze-msg").textContent = "L’analyse a échoué — réessayez.";
      $("analyze-msg").className = "msg error";
    }
    renderStatus(currentBible.status === "analyzed" ? "analyzed" : "draft");
    $("richness-block").classList.add("hidden");
  }
}

function renderGaps(gaps) {
  const list = $("gaps-list");
  list.innerHTML = "";
  if (!gaps.length) {
    list.innerHTML = '<p class="msg">Aucune zone floue détectée.</p>';
    return;
  }
  for (const gap of gaps) {
    const div = document.createElement("div");
    div.className = "gap-item";
    div.innerHTML = '<span class="axis"></span><div class="desc"></div>';
    div.querySelector(".axis").textContent = AXIS_LABELS[gap.axis] || gap.axis;
    div.querySelector(".desc").textContent = gap.description;
    list.appendChild(div);
  }
}

// ---------- Radar SVG ----------
const CX = 170, CY = 160, R = 110;

function radarPoint(axisIndex, value) {
  const angle = -Math.PI / 2 + (axisIndex * 2 * Math.PI) / AXES.length;
  const r = (R * value) / 10;
  return [CX + r * Math.cos(angle), CY + r * Math.sin(angle)];
}

function polygon(values) {
  return values
    .map((v, i) => radarPoint(i, v).map((n) => n.toFixed(1)).join(","))
    .join(" ");
}

function renderRadar(scores) {
  const values = AXES.map((axis) => scores[axis]);

  const grid = AXES.length && [2, 4, 6, 8, 10]
    .map(
      (level) =>
        '<polygon points="' + polygon(AXES.map(() => level)) +
        '" fill="none" stroke="#4b2f7a" stroke-width="' + (level === 10 ? 1.5 : 0.6) + '" />',
    )
    .join("");
  const spokes = AXES.map((_, i) => {
    const [x, y] = radarPoint(i, 10);
    return '<line x1="' + CX + '" y1="' + CY + '" x2="' + x.toFixed(1) + '" y2="' + y.toFixed(1) + '" stroke="#4b2f7a" stroke-width="0.6" />';
  }).join("");
  $("radar-grid").innerHTML = grid + spokes;

  $("radar-value").innerHTML =
    '<polygon points="' + polygon(values) +
    '" fill="url(#radar-grad)" fill-opacity="0.55" stroke="#67E8F9" stroke-width="2" stroke-linejoin="round" />';

  $("radar-labels").innerHTML = AXES.map((axis, i) => {
    const [x, y] = radarPoint(i, 12.6);
    const anchor = Math.abs(x - CX) < 8 ? "middle" : x > CX ? "start" : "end";
    return (
      '<text x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" text-anchor="' + anchor + '">' +
      AXIS_LABELS[axis] +
      ' <tspan class="score-label">' + scores[axis] + "</tspan></text>"
    );
  }).join("");
}

boot();
</script>
</body>
</html>
